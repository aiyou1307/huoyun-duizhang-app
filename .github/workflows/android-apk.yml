name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          mkdir build-source
          unzip -q source.zip -d build-source
          test -f build-source/huoyun-duizhang-app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: build-source/huoyun-duizhang-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: build-source/huoyun-duizhang-app
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: build-source/huoyun-duizhang-app
        run: npm run typecheck

      - name: Expo prebuild
        working-directory: build-source/huoyun-duizhang-app
        run: npx expo prebuild --platform android --non-interactive

      - name: Generate production JS bundle and assets
        working-directory: build-source/huoyun-duizhang-app/android
        run: ./gradlew createBundleReleaseJsAndAssets

      - name: Build standalone release APK
        working-directory: build-source/huoyun-duizhang-app/android
        run: ./gradlew assembleRelease

      - name: Verify bundled JavaScript is inside APK
        run: |
          unzip -l build-source/huoyun-duizhang-app/android/app/build/outputs/apk/release/app-release.apk > apk-contents.txt
          grep -E 'assets/index\.android\.bundle$' apk-contents.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huoyun-ledger-standalone-apk
          path: build-source/huoyun-duizhang-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
